<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TLL//HIDDEN</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f4f6f8;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;letter-spacing:2px;font-size:24px}.xp{font-weight:800}
.hero{margin:18px 0;padding:24px;border:1px solid #252a35;border-radius:22px;background:linear-gradient(135deg,#111722,#0d1017)}
h1{margin:0 0 8px;font-size:34px}.muted{color:#9da6b3}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:#171c25;border:1px solid #2a303b;padding:10px 14px;border-radius:12px}
#map{height:420px;border-radius:20px;margin:18px 0;border:1px solid #292f3a;overflow:hidden}
.places{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.place{padding:16px;border-radius:18px;background:#11151d;border:1px solid #272d38}
.place.locked{opacity:.45}.place h3{margin:0 0 7px}.tag{font-size:12px;font-weight:900;letter-spacing:1px}.rare{color:#64b5ff}.epic{color:#c184ff}.legendary{color:#ffd35a}
button{width:100%;padding:14px;border:0;border-radius:13px;background:#f4f6f8;color:#090b10;font-weight:900;cursor:pointer;margin-top:10px}
.overlay{position:fixed;inset:0;background:rgba(4,6,10,.88);display:none;align-items:center;justify-content:center;z-index:9999;padding:24px}
.overlay.show{display:flex}.unlock{max-width:520px;width:100%;text-align:center;padding:35px 25px;border-radius:28px;background:#10151e;border:1px solid #39404c;box-shadow:0 0 70px rgba(255,255,255,.08);animation:pop .55s ease}
.big{font-size:55px;animation:pulse 1.1s infinite}.new{font-size:13px;letter-spacing:4px;font-weight:900;margin-top:8px}.placeName{font-size:36px;font-weight:900;margin:12px 0}.reward{font-size:20px;font-weight:900}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}@keyframes pulse{50%{transform:scale(1.18)}}
.legend{font-size:13px;color:#9da6b3;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="logo">TLL//HIDDEN</div><div class="xp" id="xp">0 XP</div></div>
 <div class="hero">
  <div class="muted">CITY HUNT • TALLINN</div>
  <h1>Unlock the city.</h1>
  <div class="muted">Skanni füüsilise kaardi QR-kood. Uus koht avaneb sinu kaardil.</div>
  <div class="stats">
   <div class="stat">LEVEL <b id="level">1</b></div>
   <div class="stat">UNLOCKED <b id="count">0/3</b></div>
  </div>
 </div>
 <div id="map"></div>
 <div class="places" id="places"></div>
</div>

<div class="overlay" id="overlay">
 <div class="unlock">
  <div class="big">✦</div>
  <div class="new">NEW PLACE UNLOCKED</div>
  <div class="placeName" id="unlockName"></div>
  <div class="reward" id="unlockReward"></div>
  <div class="legend" id="unlockText"></div>
  <button onclick="closeUnlock()">VIEW ON MAP</button>
 </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const places={
 oldtown:{name:"VANALINN",rarity:"RARE",xp:100,lat:59.4370,lng:24.7453,desc:"Tallinna vanalinna ajalooline süda."},
 pirita:{name:"PIRITA RAND",rarity:"EPIC",xp:250,lat:59.4695,lng:24.8327,desc:"Mereäärne koht Pirita rannas."},
 viru:{name:"VIRU KESKUS",rarity:"LEGENDARY",xp:500,lat:59.4350,lng:24.7536,desc:"Üks Tallinna kõige tuntumaid keskseid kohti."}
};
const params=new URLSearchParams(location.search);
const incoming=params.get("place");
let unlocked=JSON.parse(localStorage.getItem("tll_unlocked")||"[]");
let totalXP=Number(localStorage.getItem("tll_xp")||0);

const map=L.map("map").setView([59.437,24.753],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);
const markers={};

function render(){
 document.getElementById("xp").textContent=totalXP+" XP";
 document.getElementById("level").textContent=Math.floor(totalXP/250)+1;
 document.getElementById("count").textContent=unlocked.length+"/3";
 const box=document.getElementById("places"); box.innerHTML="";
 Object.entries(places).forEach(([id,p])=>{
   const on=unlocked.includes(id);
   const d=document.createElement("div"); d.className="place"+(on?"":" locked");
   d.innerHTML=`<div class="tag ${p.rarity.toLowerCase()}">${on?p.rarity:"LOCKED"}</div>
   <h3>${on?p.name:"??????"}</h3><div class="muted">${on?p.desc:"Skanni kaart, et avada."}</div>
   ${on?`<div style="margin-top:12px"><b>+${p.xp} XP</b></div>`:""}`;
   box.appendChild(d);
   if(on && !markers[id]) markers[id]=L.marker([p.lat,p.lng]).addTo(map).bindPopup("<b>"+p.name+"</b><br>"+p.rarity+" • +"+p.xp+" XP");
 });
}
function unlock(id){
 if(!places[id]) return;
 if(!unlocked.includes(id)){
   unlocked.push(id); totalXP+=places[id].xp;
   localStorage.setItem("tll_unlocked",JSON.stringify(unlocked));
   localStorage.setItem("tll_xp",totalXP);
   document.getElementById("unlockName").textContent=places[id].name;
   document.getElementById("unlockReward").textContent=places[id].rarity+"  •  +"+places[id].xp+" XP";
   document.getElementById("unlockText").textContent="Koht on nüüd sinu kaardil avatud.";
   document.getElementById("overlay").classList.add("show");
   render();
   setTimeout(()=>{map.setView([places[id].lat,places[id].lng],15);},500);
 } else {
   map.setView([places[id].lat,places[id].lng],15);
 }
}
function closeUnlock(){document.getElementById("overlay").classList.remove("show");}
render();
if(incoming) setTimeout(()=>unlock(incoming.toLowerCase()),350);
</script>
</body>
</html>
